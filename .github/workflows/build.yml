name: Build Android wrappers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile all icon editions (unsigned)
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-checks
          path: dist/*-unsigned.apk
          retention-days: 7
