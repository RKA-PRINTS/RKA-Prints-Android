name: Publish signed APKs
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused release tag, e.g. v1.2.0
        required: true
        default: v1.2.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify signed editions
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          export KEYSTORE_PATH="$RUNNER_TEMP/rka-signing.p12"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          bash build.sh
          (cd dist && sha256sum RKA-Prints-Samsung.apk RKA-Prints-Google.apk RKA-Prints-Android.apk > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "RKA Prints Android $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest dist/RKA-Prints-Samsung.apk dist/RKA-Prints-Google.apk dist/RKA-Prints-Android.apk dist/SHA256SUMS.txt
