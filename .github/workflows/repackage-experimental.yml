name: Repackage verified experimental installers
on:
  push:
    branches: [experimental/apps]
    paths: ['.github/workflows/repackage-experimental.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm installer source is unchanged from verified build
        run: git diff --exit-code b0d217bedebcc799981517024705a2c6d7bd2461 HEAD -- experimental/desktop experimental/ios ':(exclude)**/*.md'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          run-id: 41112104681
          github-token: ${{ github.token }}
          path: bundle
      - name: Assemble corrected documentation and source
        shell: bash
        run: |
          set -euo pipefail
          for folder in bundle/installer-*; do mv "$folder" "${folder/installer-/}"; done
          cp experimental/README.md bundle/START-HERE.md
          git archive --format=zip --output=bundle/Experimental-Source.zip HEAD experimental .github/workflows/experimental-apps.yml .github/workflows/repackage-experimental.yml
          (cd bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd bundle && zip -0 -qr ../RKA-Prints-Apps-Experimental.zip .)
          sha256sum RKA-Prints-Apps-Experimental.zip > RKA-Prints-Apps-Experimental.zip.sha256
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create experimental-apps-v0.1.0 RKA-Prints-Apps-Experimental.zip RKA-Prints-Apps-Experimental.zip.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Experimental apps v0.1.0" --notes-file experimental/README.md
