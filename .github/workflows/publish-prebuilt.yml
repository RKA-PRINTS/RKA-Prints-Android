name: Publish verified v1.2 APKs
on:
  push:
    branches: [main]
    paths: ['release-assets/v1.2.0/**', '.github/workflows/publish-prebuilt.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release checksums
        working-directory: release-assets/v1.2.0
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo 'Release already exists; preserving published assets.'
            exit 0
          fi
          gh release create v1.2.0 --target "$GITHUB_SHA" --title 'RKA Prints Android 1.2' --notes-file RELEASE_NOTES.md --latest release-assets/v1.2.0/*.apk release-assets/v1.2.0/SHA256SUMS.txt
